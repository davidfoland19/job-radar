name: Job Radar

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 5am Denver time (12:00 UTC), Monday–Friday
  workflow_dispatch:          # "Run workflow" button
  push:                       # also runs when you upload a new script or settings file
    paths:
      - job_radar.py
      - companies.json
      - .github/workflows/job-radar.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Denver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load last run (for NEW tags)
        run: |
          if [ -f data/seen_jobs.json ]; then cp data/seen_jobs.json seen_jobs.json; fi

      - name: Run Job Radar
        run: python job_radar.py --no-open
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}

      - name: Save results to the repository (for the daily email task)
        run: |
          mkdir -p data
          cp jobs.csv data/jobs.csv
          cp seen_jobs.json data/seen_jobs.json
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/jobs.csv data/seen_jobs.json
          git commit -m "Job Radar results $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push

      - name: Prepare site
        run: |
          mkdir _site
          cp dashboard.html _site/index.html
          cp jobs.csv _site/jobs.csv

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
